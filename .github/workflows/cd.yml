name: CD Pipeline

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      service_name:
        default: 'ssr-client'
        required: false
        type: string
        description: 'Service name used to scope the deployment (e.g. ssr-client, api-server)'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
   inputs:
    environment:
      description: 'Environment to deploy'
      type: environment
      required: true
    service_name:
      description: 'Service name (e.g. ssr-client)'
      type: string
      required: true
      default: 'ssr-client'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
  
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # IMAGE_NAME as <account>/<repo>/branch
  IMAGE_NAME: ${{ github.repository }}/${{ github.ref_name }}
  
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      primary_tag: ${{ steps.primary_tag.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        
      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
        
      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
                # set latest tag for master branch
                type=raw,value=latest,enable=true
                type=raw,value=${{ github.run_number }}
                type=sha,format=short
          
      - name: Extract primary tag
        id: primary_tag
        run: echo "tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}" >> $GITHUB_OUTPUT

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile
          push: true
          build-args: |
            NUXT_PUBLIC_API_URL=${{ vars.NUXT_API_URL }}
            NUXT_PUBLIC_GSI_CLIENT_ID=${{ vars.NUXT_PUBLIC_GSI_CLIENT_ID }}
            NUXT_PUBLIC_GSI_SCOPES=${{ vars.NUXT_PUBLIC_GSI_SCOPES }}
